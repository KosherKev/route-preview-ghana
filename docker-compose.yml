name: route-preview-ghana

services:
  valhalla:
    image: ghcr.io/valhalla/valhalla:3.9.3
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      BUILD_CONCURRENCY: "2"
      SERVER_THREADS: "2"
    volumes:
      - ./docker/valhalla/entrypoint.sh:/entrypoint.sh:ro
      - ./data:/data:ro
      - valhalla_tiles:/valhalla
    ports:
      - "127.0.0.1:8002:8002"
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/status"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 600s
    restart: unless-stopped

  postgis:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - postgis_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"   # host Postgres already owns 5432
    mem_limit: 1g
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Self-hosted Photon geocoder (Ghana-only index). Opt-in: `docker compose --profile geocoder up -d photon`
  # after scripts/fetch-photon.sh. Loopback only; hard 1.5 GB limit so it fits the 5 GB VM beside PostGIS and Valhalla.
  photon:
    profiles: ["geocoder"]
    # Pinned by index digest (resolved 2026-11-20 from the 17-jre tag; verified with `docker manifest inspect`). Bump deliberately.
    image: eclipse-temurin:17-jre@sha256:fb2cec8da84e3f086b59e29bf432d372e396fe0c247adcfb89303a28c2e313c0
    working_dir: /photon
    command: ["java", "-Xms256m", "-Xmx768m", "-jar", "photon-0.7.4.jar", "-data-dir", "/photon", "-listen-ip", "0.0.0.0", "-listen-port", "2322"]
    volumes:
      - ./data/photon:/photon
    ports:
      - "127.0.0.1:2322:2322"
    mem_limit: 1536m
    memswap_limit: 1536m
    restart: unless-stopped

volumes:
  valhalla_tiles:
    name: route-preview-ghana_valhalla_tiles
  postgis_data:
    name: route-preview-ghana_postgis_data
